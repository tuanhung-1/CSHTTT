services:

  postgres:
    image: postgres:16
    container_name: social_postgres

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  odoo:
    image: odoo:19.0
    container_name: social_odoo

    depends_on:
      - postgres

    ports:
      - "8069:8069"

    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo

    volumes:
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

    restart: unless-stopped


volumes:
  postgres_data:
  odoo_data: